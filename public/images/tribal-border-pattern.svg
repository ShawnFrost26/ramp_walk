<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 48" width="360" height="48">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .red-fig { fill: #B91C1C; stroke: #B91C1C; }
      .green-fig { fill: #15803D; stroke: #15803D; }
      .gold-line { stroke: #D97706; stroke-width: 1; }
      .red-line { stroke: #900C22; stroke-width: 2; }
      .green-accent { fill: #15803D; }
      .white-dot { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Clean ivory/white background band -->
  <rect width="360" height="48" class="bg" />

  <!-- Top fine decorative border trim -->
  <line x1="0" y1="1" x2="360" y2="1" stroke="#D97706" stroke-width="1.5" />
  <line x1="0" y1="3" x2="360" y2="3" stroke="#900C22" stroke-width="0.8" stroke-dasharray="3,3" />

  <!-- DANCER 1: RED (x ≈ 22) -->
  <g class="red-fig">
    <!-- Head -->
    <circle cx="22" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="22,14 26,23 18,23" stroke="none" />
    <polygon points="22,23 28,32 16,32" stroke="none" />
    <!-- Arms -->
    <path d="M 20 16 L 10 13 L 5 18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 24 16 L 35 20 L 44 16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs in dynamic dance step -->
    <path d="M 19 32 L 14 37 L 17 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 25 32 L 29 37 L 27 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- DANCER 2: GREEN (x ≈ 65) -->
  <g class="green-fig">
    <!-- Head -->
    <circle cx="65" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="65,14 69,23 61,23" stroke="none" />
    <polygon points="65,23 71,32 59,32" stroke="none" />
    <!-- Arms: left joins dancer 1, right reaches dancer 3 -->
    <path d="M 63 16 L 52 14 L 44 16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 67 16 L 78 12 L 87 17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs -->
    <path d="M 62 32 L 58 37 L 62 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 68 32 L 72 36 L 76 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- DANCER 3: RED (x ≈ 108) -->
  <g class="red-fig">
    <!-- Head -->
    <circle cx="108" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="108,14 112,23 104,23" stroke="none" />
    <polygon points="108,23 114,32 102,32" stroke="none" />
    <!-- Arms -->
    <path d="M 106 16 L 96 14 L 87 17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 110 16 L 121 13 L 128 18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs -->
    <path d="M 105 32 L 100 37 L 103 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 111 32 L 115 37 L 113 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- DANCER 4: GREEN (x ≈ 146) -->
  <g class="green-fig">
    <!-- Head -->
    <circle cx="146" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="146,14 150,23 142,23" stroke="none" />
    <polygon points="146,23 152,32 140,32" stroke="none" />
    <!-- Arms: reaching towards center drummer -->
    <path d="M 144 16 L 134 14 L 128 18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 148 16 L 157 12 L 163 15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs -->
    <path d="M 143 32 L 139 37 L 143 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 149 32 L 153 36 L 157 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- CENTER FIGURE: ICONIC DRUMMER / CELEBRATION DANCER (x = 180) -->
  <g>
    <!-- Head with subtle crest -->
    <circle cx="180" cy="10" r="4.2" class="red-fig" stroke="none" />
    <path d="M 180 5.5 L 180 3" stroke="#B91C1C" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Torso -->
    <polygon points="180,14 185,21 175,21" class="red-fig" stroke="none" />
    
    <!-- Large Rounded Decorated Pot / Drum / Motif (matching image 2) -->
    <ellipse cx="180" cy="28.5" rx="14.5" ry="9.5" fill="#B91C1C" stroke="#900C22" stroke-width="1.2" />
    <!-- Inner festive green ring and patterns -->
    <ellipse cx="180" cy="28.5" rx="10" ry="6.5" fill="#15803D" />
    <circle cx="180" cy="28.5" r="3.2" fill="#B91C1C" />
    <circle cx="180" cy="28.5" r="1.3" class="white-dot" />
    <circle cx="174" cy="27" r="1.3" class="white-dot" />
    <circle cx="186" cy="27" r="1.3" class="white-dot" />
    <circle cx="175" cy="31" r="1.3" class="white-dot" />
    <circle cx="185" cy="31" r="1.3" class="white-dot" />

    <!-- Two Arms Raised High with Drum Sticks / Maracas (V-shape) -->
    <path d="M 178 15 L 168 8 L 163 4" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="162" cy="3" r="2.4" fill="#B91C1C" />
    
    <path d="M 182 15 L 192 8 L 197 4" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="198" cy="3" r="2.4" fill="#B91C1C" />
    
    <!-- Legs under drum -->
    <path d="M 176 38 L 173 42" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 184 38 L 187 42" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- DANCER 5: GREEN (x ≈ 214) -->
  <g class="green-fig">
    <!-- Head -->
    <circle cx="214" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="214,14 218,23 210,23" stroke="none" />
    <polygon points="214,23 220,32 208,32" stroke="none" />
    <!-- Arms: left from drummer, right to dancer 6 -->
    <path d="M 212 16 L 203 12 L 197 15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 216 16 L 226 14 L 232 18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs -->
    <path d="M 211 32 L 207 36 L 203 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 217 32 L 221 37 L 217 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- DANCER 6: RED (x ≈ 252) -->
  <g class="red-fig">
    <!-- Head -->
    <circle cx="252" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="252,14 256,23 248,23" stroke="none" />
    <polygon points="252,23 258,32 246,32" stroke="none" />
    <!-- Arms -->
    <path d="M 250 16 L 239 13 L 232 18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 254 16 L 264 14 L 273 17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs -->
    <path d="M 249 32 L 245 37 L 247 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 255 32 L 260 37 L 257 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- DANCER 7: GREEN (x ≈ 295) -->
  <g class="green-fig">
    <!-- Head -->
    <circle cx="295" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="295,14 299,23 291,23" stroke="none" />
    <polygon points="295,23 301,32 289,32" stroke="none" />
    <!-- Arms -->
    <path d="M 293 16 L 282 12 L 273 17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 297 16 L 308 14 L 316 18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs -->
    <path d="M 292 32 L 288 37 L 292 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 298 32 L 302 36 L 306 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- DANCER 8: RED (x ≈ 338 - loops seamlessly to Dancer 1) -->
  <g class="red-fig">
    <!-- Head -->
    <circle cx="338" cy="11" r="3.8" stroke="none" />
    <!-- Upper body & skirt -->
    <polygon points="338,14 342,23 334,23" stroke="none" />
    <polygon points="338,23 344,32 332,32" stroke="none" />
    <!-- Arms: loops to next tile's Dancer 1 -->
    <path d="M 336 16 L 325 13 L 316 18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 340 16 L 351 20 L 360 16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Legs -->
    <path d="M 335 32 L 330 37 L 333 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 341 32 L 345 37 L 343 42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <!-- Bridge arm at start (from Dancer 8 of previous tile) -->
  <path d="M 0 16 L 5 18" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Bottom Ground Baseline (matching image 2) -->
  <line x1="0" y1="42" x2="360" y2="42" stroke="#900C22" stroke-width="2" />
  <!-- Secondary festive stitch dots/accents under baseline -->
  <line x1="0" y1="45.5" x2="360" y2="45.5" stroke="#D97706" stroke-width="1.2" />
</svg>
